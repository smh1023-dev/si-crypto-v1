name: Daily SI Crypto Report

on:
  schedule:
    # KST 07:30 = UTC 22:30 (주식보다 30분 늦게 — 충돌 방지)
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-crypto
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate reports
        env:
          TZ: Asia/Seoul
          PYTHONUNBUFFERED: '1'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          FED_DIRECTION:     ${{ secrets.FED_DIRECTION }}
        run: |
          mkdir -p output database
          python crypto_generator.py --output-dir output --templates-dir templates --db-path database/journal.db

      - name: Verify output
        run: |
          ls -la output/
          if [ ! -f output/index.html ]; then
            echo "::error::index.html not generated"
            exit 1
          fi

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp output/*.html _site/
          [ -f output/etf_prices.json ] && cp output/etf_prices.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Commit DB journal
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add database/journal.db || true
          git commit -m "Update journal.db ($(date +%F))" || echo "no changes"
          git push || echo "no push"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
